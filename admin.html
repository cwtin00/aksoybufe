<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aksoy Meydan Büfe | Yönetim Paneli</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@700;800;900&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="admin.css">
</head>

<body>

<div id="toast" class="toast"></div>

<section id="login-screen" class="login-screen">
    <div class="login-card">

        <img
            src="image/Aksoy Meydan Büfe.png"
            alt="Aksoy Meydan Büfe"
            class="login-logo"
        >

        <h1>Yönetim Paneli</h1>
        <p>Menü ürünlerini yönetmek için giriş yapın.</p>

        <form id="login-form">

            <label for="login-email">E-posta</label>
            <input
                type="email"
                id="login-email"
                placeholder="E-posta adresiniz"
                required
            >

            <label for="login-password">Şifre</label>

            <div class="password-area">
                <input
                    type="password"
                    id="login-password"
                    placeholder="Şifreniz"
                    minlength="6"
                    required
                >

                <button
                    type="button"
                    id="toggle-password"
                    class="icon-button"
                >
                    <i class="fas fa-eye"></i>
                </button>
            </div>

            <button type="submit" class="primary-button">
                <i class="fas fa-right-to-bracket"></i>
                Giriş Yap
            </button>

            <p id="login-message" class="message"></p>
        </form>
    </div>
</section>

<section id="admin-panel" class="admin-panel hidden">

    <header class="admin-header">
        <div class="brand">
            <img
                src="image/Aksoy Meydan Büfe.png"
                alt="Logo"
            >

            <div>
                <h1>Aksoy Meydan Büfe</h1>
                <p>Menü Yönetim Paneli</p>
            </div>
        </div>

        <div class="header-buttons">
            <a href="index.html" target="_blank" class="secondary-button">
                <i class="fas fa-eye"></i>
                Menüyü Gör
            </a>

            <button id="logout-button" class="danger-button">
                <i class="fas fa-right-from-bracket"></i>
                Çıkış
            </button>
        </div>
    </header>

    <main class="admin-main">

        <section class="stats">
            <div class="stat-card">
                <span id="category-count">0</span>
                <p>Kategori</p>
            </div>

            <div class="stat-card">
                <span id="product-count">0</span>
                <p>Ürün</p>
            </div>
        </section>

        <section class="panel-card">
            <h2 id="form-title">Yeni Ürün Ekle</h2>

            <form id="product-form">

                <input type="hidden" id="editing-product-id">
                <input type="hidden" id="editing-category">

                <div class="form-grid">

                    <div>
                        <label for="product-category">Kategori</label>

                        <select id="product-category" required>
                            <option value="">Kategori seçin</option>
                        </select>
                    </div>

                    <div>
                        <label for="product-name">Ürün Adı</label>

                        <input
                            type="text"
                            id="product-name"
                            placeholder="Ürün adı"
                            required
                        >
                    </div>

                    <div>
                        <label for="product-price">Fiyat</label>

                        <input
                            type="text"
                            id="product-price"
                            placeholder="Örnek: 250,00"
                            inputmode="decimal"
                            required
                        >
                    </div>

                    <div class="full-width">
                        <label for="product-description">Açıklama</label>

                        <textarea
                            id="product-description"
                            rows="4"
                            placeholder="Ürün açıklaması"
                        ></textarea>
                    </div>
                </div>

                <div class="form-buttons">
                    <button type="submit" class="primary-button">
                        <i class="fas fa-floppy-disk"></i>
                        Kaydet
                    </button>

                    <button
                        type="button"
                        id="cancel-edit-button"
                        class="secondary-button hidden"
                    >
                        İptal
                    </button>
                </div>

                <p id="product-message" class="message"></p>
            </form>
        </section>

        <section class="panel-card">
            <div class="list-header">
                <div>
                    <h2>Menü Ürünleri</h2>
                    <p>Ürünleri düzenleyebilir veya silebilirsiniz.</p>
                </div>

                <input
                    type="search"
                    id="product-search"
                    placeholder="Ürün ara..."
                >
            </div>

            <div id="product-list" class="product-list">
                <p>Ürünler yükleniyor...</p>
            </div>
        </section>

    </main>
</section>

<div id="delete-modal" class="modal hidden">
    <div class="modal-card">
        <h3>Ürün silinsin mi?</h3>

        <p>
            <strong id="delete-product-name"></strong>
            kalıcı olarak silinecek.
        </p>

        <div class="modal-buttons">
            <button
                id="cancel-delete-button"
                class="secondary-button"
            >
                Vazgeç
            </button>

            <button
                id="confirm-delete-button"
                class="danger-button"
            >
                Sil
            </button>
        </div>
    </div>
</div>

<script type="module" src="admin.js"></script>

</body>
</html>
